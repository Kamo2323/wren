name: Build and release Wren

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version (e.g. 0.2.0). Leave blank for automatic 0.1.<run_number>.'
        required: false
        default: ''

permissions:
  contents: write

# Signing (all optional; see docs/RELEASING.md):
#   Repository variable WREN_SIGN_WINDOWS=true -> Authenticode-sign wren.exe, the installer and the
#     uninstaller (secrets WINDOWS_CERTIFICATE = base64 PFX, WINDOWS_CERTIFICATE_PASSWORD; optional
#     variable WINDOWS_TIMESTAMP_URL). Missing secrets or a failed check stop the release.
#   Repository variable WREN_SIGN_MACOS=true -> Developer ID signing + notarization of Wren.app and the
#     DMG (secrets APPLE_CERTIFICATE = base64 .p12, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#     APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8). Missing secrets or a failed check stop it.
#   Not requested -> unsigned Windows installer / ad-hoc signed Mac app, exactly as before, with a
#     warning on the run. The updater's own Ed25519 signature (TAURI_SIGNING_PRIVATE_KEY) is always required.
# Update source baked into the build: this repository (forks get their own releases), or the
# WREN_UPDATE_REPO variable (`none` = no updater). A fork with its own TAURI_SIGNING_PRIVATE_KEY sets
# WREN_UPDATE_PUBKEY to the matching public key. WREN_UPDATE_PRIVATE=1 allows the token/gh fallback
# (only while the repository is private).
env:
  WREN_UPDATE_REPO: ${{ vars.WREN_UPDATE_REPO || github.repository }}
  WREN_UPDATE_PUBKEY: ${{ vars.WREN_UPDATE_PUBKEY }}
  WREN_UPDATE_PRIVATE: ${{ vars.WREN_UPDATE_PRIVATE }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Compute release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - name: Verify signing key secret is configured
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY repository secret. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Check the update source matches the signing key
        env:
          REPO: ${{ github.repository }}
          HAS_PUBKEY: ${{ vars.WREN_UPDATE_PUBKEY != '' }}
        run: |
          # The official repository's public key is built in. Anywhere else, installed copies could only
          # verify updates signed with the official key, so a fork must name its own key (or turn updates off).
          if [ "$WREN_UPDATE_REPO" != "Kamo2323/wren" ] && [ "$WREN_UPDATE_REPO" != "none" ] && [ "$HAS_PUBKEY" != "true" ]; then
            echo "::error::This build would update from $WREN_UPDATE_REPO but WREN_UPDATE_PUBKEY is not set. Set the repository variable WREN_UPDATE_PUBKEY to the public key of this repository's TAURI_SIGNING_PRIVATE_KEY, or WREN_UPDATE_REPO=none."
            exit 1
          fi
          echo "update source: $WREN_UPDATE_REPO"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Compute version and release notes
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VER="$(node scripts/ci-release-meta.mjs bump --run-number "$RUN_NUMBER" --version "$INPUT_VERSION" | tr -d '\r\n')"
          if [ -z "$VER" ]; then
            echo "Failed to compute version" >&2
            exit 1
          fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_ID="ci-${VER}-${SHORT_SHA}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log --no-merges --pretty=format:'- %s' "${PREV_TAG}..HEAD" || true)"
          else
            COMMITS="$(git log --no-merges -n 5 --pretty=format:'- %s' || true)"
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="Maintenance update."
          fi
          printf '%s\n' "$COMMITS" > release-notes.md
          echo "Release version: $VER (tag v$VER, build $BUILD_ID)"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-windows:
    name: Build Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check NSIS template and unit tests
        shell: pwsh
        run: |
          node scripts/nsis-template.mjs --check
          node scripts/unit-tests.mjs

      - name: Stamp release version
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/ci-release-meta.mjs bump --version "$env:VERSION" | Out-Null

      - name: Check Windows signing configuration
        id: wsign
        shell: pwsh
        env:
          SIGN_REQUESTED: ${{ vars.WREN_SIGN_WINDOWS }}
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          HAS_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          if ($env:SIGN_REQUESTED -eq 'true') {
            if ($env:HAS_CERT -ne 'true' -or $env:HAS_PASSWORD -ne 'true') {
              Write-Output "::error::WREN_SIGN_WINDOWS=true but the WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets are missing. Nothing is published unsigned."
              exit 1
            }
            "enabled=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          } else {
            Write-Output "::warning::Windows Authenticode signing is not requested (WREN_SIGN_WINDOWS is not 'true'): the installer will be unsigned and SmartScreen will warn."
            "enabled=false" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          }

      - name: Import Windows signing certificate
        id: wcert
        if: steps.wsign.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Import

      - name: Build Windows NSIS installer
        shell: pwsh
        env:
          WREN_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          SIGN_ENABLED: ${{ steps.wsign.outputs.enabled }}
          THUMBPRINT: ${{ steps.wcert.outputs.thumbprint }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          if ($env:SIGN_ENABLED -eq 'true') {
            $overlay = Join-Path $env:RUNNER_TEMP 'tauri.windows-signing.json'
            ./scripts/sign-windows.ps1 -Config -Thumbprint $env:THUMBPRINT -TimestampUrl $env:TIMESTAMP_URL -Out $overlay
            npx tauri build --bundles nsis --config $overlay
          } else {
            npx tauri build --bundles nsis
          }
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }

      - name: Verify Authenticode signatures
        if: steps.wsign.outputs.enabled == 'true'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.wcert.outputs.thumbprint }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis\Wren_$($env:VERSION)_x64-setup.exe"
          # Check what ships: the installer and the app/uninstaller inside it. Tauri signs wren.exe before
          # packaging; the copy left in the target folder is not the one users get (seen in a local proof).
          $inside = Join-Path $env:RUNNER_TEMP 'wren-signed-payload'
          7z x -y "-o$inside" $installer wren.exe uninstall.exe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not unpack $installer" }
          ./scripts/sign-windows.ps1 -Verify -RequireTrusted -Thumbprint $env:THUMBPRINT -Files $installer, (Join-Path $inside 'wren.exe'), (Join-Path $inside 'uninstall.exe')

      - name: Sign Windows installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ver = $env:VERSION
          $installerName = "Wren_${ver}_x64-setup.exe"
          $installerPath = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis\$installerName"
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Expected installer not found at $installerPath"
          }
          npx tauri signer sign --app-version $ver $installerPath
          if (-not (Test-Path -LiteralPath "$installerPath.sig")) {
            throw "Expected signature not found at $installerPath.sig"
          }
          New-Item -ItemType Directory -Force -Path dist-release-win | Out-Null
          Copy-Item -LiteralPath $installerPath -Destination dist-release-win\
          Copy-Item -LiteralPath "$installerPath.sig" -Destination dist-release-win\
          # Read by the publish job: a release that asked for signing must carry this proof.
          $auth = Get-AuthenticodeSignature -LiteralPath $installerPath
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist-release-win\signing-windows.txt'), "authenticode=$($auth.Status)`n")

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist-release-win/*

  build-macos:
    name: Build macOS Apple Silicon app
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: node scripts/unit-tests.mjs

      - name: Stamp release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/ci-release-meta.mjs bump --version "$VERSION" >/dev/null

      - name: Check macOS signing configuration
        id: msign
        env:
          SIGN_REQUESTED: ${{ vars.WREN_SIGN_MACOS }}
          HAS_ALL: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          if [ "$SIGN_REQUESTED" = "true" ]; then
            if [ "$HAS_ALL" != "true" ]; then
              echo "::error::WREN_SIGN_MACOS=true but a Developer ID or notarization secret is missing (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8). Nothing is published unsigned."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS Developer ID signing is not requested (WREN_SIGN_MACOS is not 'true'): the app is ad-hoc signed and Gatekeeper will block it on other Macs until it is allowed by hand."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate and notarization key
        if: steps.msign.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/wren-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/wren-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY"
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          echo "WREN_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Developer ID Application" >/dev/null || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }

      - name: Build macOS app bundle
        env:
          WREN_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          SIGN_ENABLED: ${{ steps.msign.outputs.enabled }}
          SECRET_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGN_ENABLED" = "true" ]; then
            # Tauri signs with the imported identity (Hardened Runtime + Entitlements.plist), then
            # notarizes and staples Wren.app with the App Store Connect API key.
            export APPLE_SIGNING_IDENTITY="$SECRET_SIGNING_IDENTITY"
            export APPLE_API_KEY="$SECRET_API_KEY_ID"
            export APPLE_API_ISSUER="$SECRET_API_ISSUER"
            npx tauri build --target aarch64-apple-darwin --bundles app --config src-tauri/tauri.macos-release.json
          else
            npx tauri build --target aarch64-apple-darwin --bundles app
          fi

      - name: Package DMG, updater archive & sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGN_ENABLED: ${{ steps.msign.outputs.enabled }}
          SECRET_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          BUNDLE_DIR="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle"
          APP_DIR="$BUNDLE_DIR/macos/Wren.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Expected Wren.app not found at $APP_DIR" >&2
            exit 1
          fi
          if [ "$SIGN_ENABLED" = "true" ]; then
            # Fail closed: a release that asked for Developer ID must be signed, hardened and notarized.
            codesign --verify --deep --strict --verbose=2 "$APP_DIR"
            AUTH="$(codesign -dvv "$APP_DIR" 2>&1 | sed -n 's/^Authority=//p' | head -n 1)"
            case "$AUTH" in "Developer ID Application:"*) ;; *) echo "::error::Wren.app is not Developer ID signed ($AUTH)"; exit 1 ;; esac
            codesign -dvv "$APP_DIR" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::Wren.app is missing the Hardened Runtime"; exit 1; }
            xcrun stapler validate "$APP_DIR"
            spctl --assess --type execute --verbose=2 "$APP_DIR"
          else
            # Ad-hoc sign so local launches work without a paid Apple Developer ID (Gatekeeper still warns).
            codesign --force --deep --sign - "$APP_DIR"
            codesign --verify --deep --strict "$APP_DIR"
          fi

          mkdir -p dist-release-mac
          ARCHIVE_NAME="Wren_${VERSION}_aarch64.app.tar.gz"
          ARCHIVE_PATH="dist-release-mac/$ARCHIVE_NAME"
          COPYFILE_DISABLE=1 tar -czf "$ARCHIVE_PATH" -C "$BUNDLE_DIR/macos" "Wren.app"
          npx tauri signer sign --app-version "$VERSION" "$ARCHIVE_PATH"
          if [ ! -f "$ARCHIVE_PATH.sig" ]; then
            echo "Expected signature not found at $ARCHIVE_PATH.sig" >&2
            exit 1
          fi

          # Package a Finder-free DMG wrapping the signed Wren.app + /Applications symlink.
          DMG_STAGE="$(mktemp -d)"
          ditto "$APP_DIR" "$DMG_STAGE/Wren.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          DMG="dist-release-mac/Wren_${VERSION}_aarch64.dmg"
          hdiutil create -volname "Wren" -srcfolder "$DMG_STAGE" -ov -format UDZO "$DMG"
          rm -rf "$DMG_STAGE"
          if [ "$SIGN_ENABLED" = "true" ]; then
            codesign --sign "$SECRET_SIGNING_IDENTITY" --timestamp "$DMG"
            xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$SECRET_API_KEY_ID" --issuer "$SECRET_API_ISSUER" --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
            echo "developer-id=notarized" > dist-release-mac/signing-macos.txt
          else
            echo "developer-id=none" > dist-release-mac/signing-macos.txt
          fi

      - name: Remove signing keychain and key
        if: always() && steps.msign.outputs.enabled == 'true'
        run: |
          [ -n "${WREN_SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$WREN_SIGNING_KEYCHAIN" || true
          rm -f "${APPLE_API_KEY_PATH:-/nonexistent}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist-release-mac/*

  publish:
    name: Publish unified GitHub Release
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Refuse to publish an unsigned build that asked for signing
        env:
          SIGN_WINDOWS: ${{ vars.WREN_SIGN_WINDOWS }}
          SIGN_MACOS: ${{ vars.WREN_SIGN_MACOS }}
        run: |
          if [ "$SIGN_WINDOWS" = "true" ] && ! tr -d '\r' < release-artifacts/windows-release/signing-windows.txt 2>/dev/null | grep -qx 'authenticode=Valid'; then
            echo "::error::Windows signing was requested but the installer's Authenticode signature is not Valid."; exit 1
          fi
          if [ "$SIGN_MACOS" = "true" ] && ! tr -d '\r' < release-artifacts/macos-release/signing-macos.txt 2>/dev/null | grep -qx 'developer-id=notarized'; then
            echo "::error::macOS signing was requested but the app/DMG were not notarized."; exit 1
          fi
          echo "signing: windows=${SIGN_WINDOWS:-off} macos=${SIGN_MACOS:-off}"

      - name: Build unified latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          WIN_NAME="Wren_${VERSION}_x64-setup.exe"
          WIN_FILE="release-artifacts/windows-release/$WIN_NAME"
          WIN_SIG="${WIN_FILE}.sig"

          MAC_ARCHIVE_NAME="Wren_${VERSION}_aarch64.app.tar.gz"
          MAC_ARCHIVE="release-artifacts/macos-release/$MAC_ARCHIVE_NAME"
          MAC_SIG="${MAC_ARCHIVE}.sig"
          MAC_DMG="release-artifacts/macos-release/Wren_${VERSION}_aarch64.dmg"
          NOTES="release-artifacts/release-notes/release-notes.md"
          MANIFEST="release-artifacts/latest.json"

          node scripts/ci-release-meta.mjs manifest \
            --version "$VERSION" \
            --repo "$REPO" \
            --installer "$WIN_NAME" \
            --sig-file "$WIN_SIG" \
            --mac-installer "$MAC_ARCHIVE_NAME" \
            --mac-sig-file "$MAC_SIG" \
            --mac-platform darwin-aarch64 \
            --notes-file "$NOTES" \
            --out "$MANIFEST"

          FILES=("$WIN_FILE" "$WIN_SIG" "$MAC_ARCHIVE" "$MAC_SIG" "$MANIFEST")
          if [ -f "$MAC_DMG" ]; then
            FILES+=("$MAC_DMG")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "Wren v$VERSION" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "Wren v$VERSION" \
              --notes-file "$NOTES" \
              --latest
          fi
