[package]
name = "wren"
version = "0.1.0"
description = "Wren — local dictation"
authors = ["Maximilian"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
crossbeam-channel = "0.5.17"
parking_lot = "0.13.0"
strsim = "0.11.1"
similar = "3.2.1"
rphonetic = "4.0.0"
hound = "3.5.1"
rubato = "5.0.1"
cpal = "0.18.2"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_Security", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_System_Console"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
