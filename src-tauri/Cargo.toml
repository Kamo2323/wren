[package]
name = "wren"
version = "0.1.0"
description = "Wren — local dictation"
authors = ["Maximilian"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
crossbeam-channel = "0.5.17"
parking_lot = "0.13.0"
strsim = "0.11.1"
similar = "3.2.1"
rphonetic = "4.0.0"
hound = "3.5.1"
rubato = "5.0.1"
cpal = "0.18.2"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "blocking", "json"] }
minisign-verify = "0.2"
semver = "1"
base64 = "0.22"
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
keyring = "4"

[target.'cfg(windows)'.dependencies]
# Meetings: Teams process-loopback capture (AUDIOCLIENT_ACTIVATION_TYPE_PROCESS_LOOPBACK).
wasapi = "0.27"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_Security", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSBitmapImageRep",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSScreen",
    "NSSound",
    "NSWindow",
    "NSWorkspace",
    "block2",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
